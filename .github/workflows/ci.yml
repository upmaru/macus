name: Native checks

on:
  # Git Flow branches, so stacked feature PRs are checked too.
  pull_request:
    branches: [develop, main, 'feature/**', 'release/**', 'hotfix/**']
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Swift and OpenSpec
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Toolchain
        run: swift --version
      - name: Debug, tests, release, formatting and guest syntax
        run: Integration/scripts/check.sh
      - name: Validate OpenSpec
        run: npx --yes --package @fission-ai/openspec@1.14.0 openspec validate --all --strict --no-interactive

  server:
    name: Elixir server
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # The server tests build the official Incus reference drivers with
      # `mise exec -- go`, so the repository's mise.toml must be trusted.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: erlang elixir go
          cache: true
      - name: Toolchain
        run: mise exec -- elixir --version && mise exec -- go version
      - name: Dependencies
        run: |
          mise exec -- mix local.hex --force
          mise exec -- mix local.rebar --force
          mise exec -- mix deps.get
      - name: Formatting
        run: mise exec -- mix format --check-formatted
      - name: Compile without warnings
        run: mise exec -- mix compile --warnings-as-errors
      - name: Tests
        run: mise exec -- mix test
