schema: spec-driven
context: |
  Macus supports Apple Silicon and macOS 15+. Swift 6 and Apple
  Virtualization.framework own the outer VM; VZ code stays in
  Sources/Macus/Virtualization and the SwiftPM executable remains small.
  A separate headless Phoenix/Cowboy OTP application :macus in server/ uses
  Macus and MacusWeb namespaces. The approved add-elixir-server change makes
  its authenticated HTTPS gateway the normal runtime, native Incus and MCP
  connection boundary. Swift runtime.sock and incus.sock remain private
  owner-only Unix transports with no TCP listeners. Preserve native Incus
  routes, streaming and upgrade protocols; gateway trust is distinct from
  guest trust. Typed clients and named MCP tools delegate workload behavior
  to Incus. No external host VM runtime, SSH, GUI or workload orchestration.
  Macus depends on the pure :opsmaru_incus library (upmaru/opsmaru-incus)
  for the Incus client, native gateway mechanics and shared Incus MCP tools;
  it does not depend on the :opsmaru central service. The first milestone is
  a standalone Macus with synchronous MCP tools and no durable MCP tasks.
  Central registration (macus connect, outbound connector) is the later
  add-central-registration change; Macus remains one local target and
  independently usable, and native Incus trust stays separate from any
  central identity.
  Use maintained TamaMCP contracts, explicit scopes and bounded streams; do
  not claim unsupported protocol features or parity.
  Pin toolchains in mise and dependencies in SwiftPM/Mix lockfiles. Deliver
  the Swift executable and bundled-ERTS Mix release as one matching package,
  with independent per-user launchd jobs. Installation is passive; explicit
  macus start owns activation. Preserve runtime and credential state.
  Existing Homebrew candidate generation and real measured-checksum evidence
  remain the delivery baseline. No fake hashes or publication claims.
  Use Git Flow feature branches from develop. Validate planning before code.
  Canonical checks are Integration/scripts/check.sh and strict OpenSpec
  validation via mise. Unit/protocol and package tests do not establish guest
  or LAN acceptance; hardware gates require explicit opt-in and isolated state.
